name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            suffix: ""
            prebuilt: llama-b9837-bin-macos-arm64.tar.gz
          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
            prebuilt: llama-b9837-bin-ubuntu-x64.tar.gz
          - name: Linux-x86_64-vulkan
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: -vulkan
            vulkan: true
            prebuilt: llama-b9837-bin-ubuntu-vulkan-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Prebuilt binary release — download shared libraries instead of building from source
      - name: Download prebuilt llama.cpp
        if: matrix.prebuilt
        run: |
          curl -sSL --fail -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/b9837/${{ matrix.prebuilt }}"
          mkdir -p /tmp/llama-prebuilt
          tar xzf /tmp/llama.tar.gz -C /tmp/llama-prebuilt
          echo "LLAMA_CPP_PREBUILT_DIR=/tmp/llama-prebuilt/llama-b9837" >> "$GITHUB_ENV"
          echo "LLAMA_PREBUILT_SRC=/tmp/llama-prebuilt/llama-b9837" >> "$GITHUB_ENV"

      - name: Install deps (Linux, prebuilt)
        if: runner.os == 'Linux' && matrix.prebuilt
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev

      # libvulkan-dev provides the unversioned libvulkan.so the linker needs
      # (-lvulkan). Required even for the prebuilt Vulkan target: its archive
      # ships libggml-vulkan but links against the system Vulkan loader.
      - name: Install Vulkan SDK
        if: matrix.vulkan
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}${{ matrix.suffix }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}${{ matrix.suffix }}-cargo-release-

      # Bake an rpath so the binary finds the .so/.dylib files bundled next to it
      # (see Package artifact below). build.rs can't do this: a dependency's
      # cargo:rustc-link-arg does not propagate to the final binary. RUSTFLAGS
      # does. $ORIGIN / @loader_path resolve to the binary's own directory.
      - name: Build release binary
        env:
          GGML_VULKAN: ${{ matrix.vulkan && 'ON' || '' }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,@loader_path"
          else
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,\$ORIGIN"
          fi
          cargo build --release --features llama-native -p autocommit-cli --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          SUFFIX="${{ matrix.suffix }}"
          ARCHIVE="autocommit-${TARGET}${SUFFIX}.tar.gz"

          mkdir staging
          cp "target/${{ matrix.target }}/release/autocommit" staging/

          # Bundle prebuilt shared libraries alongside the binary
          if [ -n "$LLAMA_PREBUILT_SRC" ]; then
            echo "Bundling prebuilt shared libraries from $LLAMA_PREBUILT_SRC"
            cp -a "$LLAMA_PREBUILT_SRC"/libllama*.dylib staging/ 2>/dev/null || true
            cp -a "$LLAMA_PREBUILT_SRC"/libggml*.dylib staging/ 2>/dev/null || true
            cp -a "$LLAMA_PREBUILT_SRC"/libllama*.so* staging/ 2>/dev/null || true
            cp -a "$LLAMA_PREBUILT_SRC"/libggml*.so* staging/ 2>/dev/null || true
          fi

          tar czf "${ARCHIVE}" -C staging .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: autocommit-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            autocommit-*.tar.gz
            autocommit-*.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    # Run even if some build targets failed, so the binaries that *did* build
    # still get published. Including a status function overrides Actions'
    # implicit success() gate, so `!cancelled()` runs even when a `needs` leg
    # failed — while still skipping a manually cancelled run (unlike always(),
    # which would cut a release from a cancelled build). Failed matrix legs
    # upload no artifact, so they're simply absent from the release; the overall
    # run stays red to keep the failures visible.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List artifacts
        id: artifacts
        run: |
          ls -la autocommit-* 2>/dev/null || true
          count=$(ls autocommit-*.tar.gz 2>/dev/null | wc -l)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Found ${count} release artifact(s) to publish."

      - name: Fail if nothing built
        if: steps.artifacts.outputs.count == '0'
        run: |
          echo "::error::No build artifacts were produced — every target failed."
          exit 1

      - uses: softprops/action-gh-release@v2
        if: steps.artifacts.outputs.count != '0'
        with:
          generate_release_notes: true
          files: |
            autocommit-*.tar.gz
            autocommit-*.tar.gz.sha256
